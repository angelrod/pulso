# Pulso.app: Apple silicon, ad-hoc signed (no Apple Developer ID yet).
appId: io.github.angelrod.pulso
productName: Pulso
copyright: Copyright © 2026 Miguel Angel Rod
directories:
  # .noindex keeps Spotlight from listing every build next to the installed app.
  output: release.noindex
  buildResources: resources
# Main, preload and renderer are bundled by electron-vite; nothing else goes into app.asar.
files:
  - out/**/*
  - package.json
  - "!**/node_modules/**"
# The UI is English; the other Chromium locales are dead weight.
electronLanguages:
  - en
# Hardening, and launch safety: with runAsNode off, an inherited ELECTRON_RUN_AS_NODE
# (set by some editors' terminals) can no longer turn Pulso into a bare Node process.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
# Icons are read from disk at runtime (tray, dialogs, About panel), outside app.asar.
extraResources:
  - from: resources
    to: resources
    filter:
      - "*.png"
mac:
  target:
    - target: dmg
      arch: arm64
  icon: resources/icon.icns
  category: public.app-category.utilities
  darkModeSupport: true
  extendInfo:
    # A menu bar app: no Dock icon, no app menu.
    LSUIElement: true
    # Shown by macOS the first time Pulso asks an app to quit through Apple Events.
    NSAppleEventsUsageDescription: Pulso asks an app to quit, the way ⌘Q does, when you click Quit.
  # No Developer ID yet: scripts/adhoc-sign.cjs signs ad-hoc instead (see afterSign).
  # To sign and notarize later: set identity to the "Developer ID Application: …" name,
  # hardenedRuntime: true, notarize: true, export APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
  # and APPLE_TEAM_ID, and remove afterSign.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
afterSign: scripts/adhoc-sign.cjs
dmg:
  artifactName: Pulso-${version}-arm64.${ext}
