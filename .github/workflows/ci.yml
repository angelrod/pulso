# Runs every check on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # macos-15 runners are Apple silicon with Xcode 16 (Swift 6), which Pulso needs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: sh native/verify.sh
