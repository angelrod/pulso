# Builds Pulso and publishes a GitHub release when a version tag (v2.0.0) is pushed.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - run: sh native/verify.sh

      - name: Package the app, the dmg and the signed update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: sh native/scripts/package-release.sh "${GITHUB_REF_NAME#v}" release-out

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            native/release-out/*.dmg
            native/release-out/*.zip
            native/release-out/appcast.xml
          generate_release_notes: true
